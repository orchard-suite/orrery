name: Release

# Every push to main is tested and may release. The test job runs the full
# check; the version job cuts the version; when it cut one, the build
# publishes the nine images, the agent plugin, and the command line of the
# new tag, each signed.
on:
  push:
    branches: [main]
    # Docs alone do not release, but a skill's text ships in the plugin.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The build signs keyless; a called workflow gets no more than this.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The branch tip, not the pushed commit: a run queued behind another
      # release must see that release's version commit and tags.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # Verify first: the commit must carry the landing proof that
      # release-damnit land signed after the check passed.
      - id: release
        uses: dsswift/release-damnit@v1.11.0
        with:
          verify: 'true'
          allowed-signers: ${{ vars.RELEASE_DAMNIT_ALLOWED_SIGNERS }}
          since-last-release: 'true'
          publish: 'true'

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
