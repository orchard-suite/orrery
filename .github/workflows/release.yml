name: Release

# Every push to main may release. The landing already ran the full check and
# signed its proof, so the release verifies that proof and goes on at once:
# the version job cuts the version and, when it cut one, the build publishes
# the nine images, the agent plugin, and the command line of the new tag,
# each signed. The test job runs beside them from a clean checkout, a
# witness that holds nothing up (ORC-5004).
on:
  push:
    branches: [main]
    # Docs alone do not release, but a skill's text ships in the plugin.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'skills/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The build signs keyless; a called workflow gets no more than this.
  id-token: write

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Only the version step holds the release lock, so a release waits for
  # the one before it to tag, never for it to build.
  version:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The branch tip, not the pushed commit: a run queued behind another
      # release must see that release's version commit and tags.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # Verify first: the commit must carry the landing proof that
      # release-damnit land signed after the check passed.
      - id: release
        uses: dsswift/release-damnit@v1.11.0
        with:
          verify: 'true'
          allowed-signers: ${{ vars.RELEASE_DAMNIT_ALLOWED_SIGNERS }}
          since-last-release: 'true'
          publish: 'true'

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
