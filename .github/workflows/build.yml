name: Build

# The release workflow calls this with the new tag. It publishes nine images,
# each tagged with the version:
#   orrery               the hub
#   orrery-pusher-k8s    the k8s pusher
#   orrery-pusher-entra  the Entra pusher
#   orrery-cli           the generic CLI
#   orrery-runner        the health check runner
#   orrery-access-runner the runner carrying entra-grant, for access actions
#   orrery-azure-runner  the runner carrying azure-restart and azure-job-start, for
#                        restart and job actions
#   orrery-telemetry-runner the runner carrying telemetry-query, for tools that
#                        read logs and metrics
#   orrery-job-starter   the starter of one container a run, for job actions
# to ghcr.io/orchard-suite/<name>. The GitHub Container Registry packages are
# public, so a cluster pulls them without a secret; pin them by digest.
# Each image is signed with cosign keyless as this workflow's GitHub identity,
# with a syft SBOM attested to it.
#
# The release calls this with its new tag; run it by hand to build a tag
# again. It works through the images, plugin, and cli actions in
# .github/actions. The Go programs compile on the runner while the hub's
# image builds, with Go's caches restored from the Actions cache, and each
# Go image copies its program in (go.Dockerfile, BINARIES=prebuilt).
#
# It also publishes the agent plugin and the command line, which plugin.yml
# and cli.yml publish on their own for a tag that is already released.
# The tag must match the version in package.json; that file is the source of truth.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # Needed to get an OIDC token for keyless signing.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/images
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/plugin
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/cli
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ready: 'true'
