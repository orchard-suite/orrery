name: CLI
description: >
  Publishes the command line of the checked-out tag for people's computers:
  one file a platform, with their SHA256SUMS, pushed as one OCI artifact to
  the hub's public package, ghcr.io/orchard-suite/orrery:cli-<version>, and signed
  with cosign keyless like the images. An estate verifies it and serves the
  files from its own forge with no GitHub credential.
inputs:
  tag:
    description: The release tag, such as v1.33.0; it must match package.json
    required: true
  token:
    description: A token that pushes to ghcr.io, the workflow's GITHUB_TOKEN
    required: true
  ready:
    description: "'true' when the job already set up Go"
    default: 'false'
runs:
  using: composite
  steps:
    - name: Check the tag matches package.json
      shell: bash
      id: version
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version=$(jq -r .version package.json)
        if [ "v$version" != "$TAG" ]; then
          echo "Tag $TAG does not match package.json version $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@v5
      if: inputs.ready != 'true'
      with:
        go-version-file: go.mod
    # One file a platform, named so a script picks its own by name.
    - name: Build the command line
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -eu
        rm -rf "$RUNNER_TEMP/cli"; mkdir -p "$RUNNER_TEMP/cli"
        for target in darwin/arm64 linux/amd64; do
          os=${target%/*}; arch=${target#*/}
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/cli/orrery-$os-$arch" ./cmd/orrery
        done
        (cd "$RUNNER_TEMP/cli" && sha256sum * > SHA256SUMS && cat SHA256SUMS)
    - uses: ./.github/actions/tools
      with:
        need: oras cosign
    - name: Push the command line as an OCI artifact
      shell: bash
      id: push
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -eu
        echo "${{ inputs.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        cd "$RUNNER_TEMP/cli"
        oras push "ghcr.io/orchard-suite/orrery:cli-$VERSION" \
          --artifact-type application/vnd.orchard-suite.orrery-cli.v1 \
          --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
          --annotation "org.opencontainers.image.version=$VERSION" \
          --format go-template='{{.digest}}' \
          orrery-darwin-arm64:application/octet-stream \
          orrery-linux-amd64:application/octet-stream \
          SHA256SUMS:text/plain > "$RUNNER_TEMP/cli-digest.txt"
        echo "digest=$(cat "$RUNNER_TEMP/cli-digest.txt")" >> "$GITHUB_OUTPUT"
    - name: Sign and verify the command line artifact
      shell: bash
      env:
        IDENTITY: ^https://github.com/${{ github.repository }}/
        REF: ghcr.io/orchard-suite/orrery@${{ steps.push.outputs.digest }}
      run: |
        cosign sign --yes "$REF"
        cosign verify "$REF" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp "$IDENTITY" > /dev/null
    - name: Record what was published
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        {
          echo "## Command line"
          echo
          echo "- \`ghcr.io/orchard-suite/orrery:cli-$VERSION\` ($DIGEST)"
          echo '```'
          cat "$RUNNER_TEMP/cli/SHA256SUMS"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
