name: Images
description: >
  Builds, pushes, signs, and attests the nine images of the checked-out tag
  to ghcr.io/orchard-suite: the hub, and the eight Go images, whose programs compile on the
  runner while the hub's image builds and are then copied in
  (go.Dockerfile, BINARIES=prebuilt). The hub's image copies the web app
  built here (Dockerfile, WEB=prebuilt). Each is signed, all at once, with cosign keyless as
  the workflow's GitHub identity, with a syft SBOM attested to it, and
  verified by digest, never by tag: a tag can move.
inputs:
  tag:
    description: The release tag, such as v1.33.0; it must match package.json
    required: true
  token:
    description: A token that pushes to ghcr.io, the workflow's GITHUB_TOKEN
    required: true
  ready:
    description: "'true' when the job already set up Node and Go, and ran npm ci"
    default: 'false'
outputs:
  version:
    description: The version, without the v
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Check the tag matches package.json
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version=$(jq -r .version package.json)
        if [ "v$version" != "$TAG" ]; then
          echo "Tag $TAG does not match package.json version $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    # setup-go keeps Go's build and module caches in the Actions cache,
    # keyed by go.sum, and unpacks them onto the runner's own disk.
    - uses: actions/setup-go@v5
      if: inputs.ready != 'true'
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@v4
      if: inputs.ready != 'true'
      with:
        node-version: 24
        cache: npm
    - uses: ./.github/actions/tools
      with:
        need: cosign syft
    # The programs compile while the hub's image builds; "Wait for the Go
    # programs" below fails the job when they did not.
    - name: Compile the Go programs, in the background
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: "0"
      run: |
        rm -f "$RUNNER_TEMP/go-build.status"
        nohup bash -c 'go build -ldflags "-s -w -X main.version=${VERSION}" -o out/ ./cmd/pusher-k8s ./cmd/pusher-entra ./cmd/orrery ./cmd/runner ./cmd/entra-grant ./cmd/azure-restart ./cmd/azure-job-start ./cmd/telemetry-query ./cmd/annals-read ./cmd/job-starter; echo $? > "$RUNNER_TEMP/go-build.status"' > "$RUNNER_TEMP/go-build.log" 2>&1 &
    # The web app, built from this tag's source: its version is the one the
    # page compares with the hub's to offer a reload.
    - name: Web app
      shell: bash
      run: |
        [ -d node_modules ] || npm ci
        npm run build
    - name: Hub
      id: hub
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery,push-by-digest=true,name-canonical=true,push=true
        build-args: |
          WEB=prebuilt
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        # The layers that rarely change (git in the base, the packages) come
        # from the last build's cache in the registry; only a changed layer
        # is uploaded again.
        cache-from: type=registry,ref=ghcr.io/orchard-suite/orrery:buildcache
        cache-to: type=registry,ref=ghcr.io/orchard-suite/orrery:buildcache,mode=max
    - name: Wait for the Go programs
      shell: bash
      run: |
        for _ in $(seq 600); do [ -f "$RUNNER_TEMP/go-build.status" ] && break; sleep 2; done
        cat "$RUNNER_TEMP/go-build.log"
        if [ ! -f "$RUNNER_TEMP/go-build.status" ]; then echo "The Go programs did not compile in 20 minutes" >&2; exit 1; fi
        [ "$(cat "$RUNNER_TEMP/go-build.status")" = 0 ] || exit 1
        ls -l out
    - name: k8s pusher
      id: pusher-k8s
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: pusher-k8s
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-pusher-k8s,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Entra pusher
      id: pusher-entra
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: pusher-entra
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-pusher-entra,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: CLI
      id: cli
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: cli
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-cli,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Runner
      id: runner
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: runner
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-runner,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Access runner
      id: access-runner
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: access-runner
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-access-runner,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Azure runner
      id: azure-runner
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: azure-runner
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-azure-runner,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Telemetry runner
      id: telemetry-runner
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: telemetry-runner
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-telemetry-runner,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Job starter
      id: job-starter
      uses: docker/build-push-action@v5
      with:
        context: .
        file: go.Dockerfile
        target: job-starter
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ steps.version.outputs.version }}
        platforms: linux/amd64
        # By digest only: the tags come last, once the image is signed.
        outputs: type=image,name=ghcr.io/orchard-suite/orrery-job-starter,push-by-digest=true,name-canonical=true,push=true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
    - name: Sign and attest the images
      shell: bash
      env:
        IDENTITY: ^https://github.com/${{ github.repository }}/
        IMAGES: |
          ghcr.io/orchard-suite/orrery@${{ steps.hub.outputs.digest }}
          ghcr.io/orchard-suite/orrery-pusher-k8s@${{ steps.pusher-k8s.outputs.digest }}
          ghcr.io/orchard-suite/orrery-pusher-entra@${{ steps.pusher-entra.outputs.digest }}
          ghcr.io/orchard-suite/orrery-cli@${{ steps.cli.outputs.digest }}
          ghcr.io/orchard-suite/orrery-runner@${{ steps.runner.outputs.digest }}
          ghcr.io/orchard-suite/orrery-access-runner@${{ steps.access-runner.outputs.digest }}
          ghcr.io/orchard-suite/orrery-azure-runner@${{ steps.azure-runner.outputs.digest }}
          ghcr.io/orchard-suite/orrery-telemetry-runner@${{ steps.telemetry-runner.outputs.digest }}
          ghcr.io/orchard-suite/orrery-job-starter@${{ steps.job-starter.outputs.digest }}
      # Each image is signed, attested, and verified at the same time as the
      # others; its log is printed whole when it ends.
      run: |
        # Each cosign keeps its own trust cache (TUF_ROOT): the processes
        # running at once would otherwise contend for one cache's lock.
        sign() {
          ref=$1; sbom=$(mktemp)
          export TUF_ROOT; TUF_ROOT=$(mktemp -d)
          cosign sign --yes "$ref"
          syft "$ref" -o spdx-json > "$sbom"
          cosign attest --yes --predicate "$sbom" --type spdxjson "$ref"
          cosign verify "$ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY" > /dev/null
          cosign verify-attestation "$ref" --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY" > /dev/null
        }
        dir=$(mktemp -d); i=0
        for ref in $IMAGES; do
          i=$((i+1)); ( set -e; sign "$ref" ) > "$dir/$i.log" 2>&1 & echo "$! $i $ref" >> "$dir/jobs"
        done
        failed=0
        while read -r pid n ref; do
          if wait "$pid"; then echo "signed $ref"; else echo "FAILED $ref" >&2; failed=1; fi
          cat "$dir/$n.log"
        done < "$dir/jobs"
        exit $failed
    # Last: whatever follows the version tags sees one only once the image
    # it names is signed and verified.
    - name: Tag the versions
      shell: bash
      run: |
        tag() {
          ref=$1; shift
          for t in "$@"; do
            docker buildx imagetools create --tag "$t" "$ref"
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ "$got" = "${ref#*@}" ] || { echo "$t is $got, not the signed ${ref#*@}" >&2; exit 1; }
          done
        }
        tag "ghcr.io/orchard-suite/orrery@${{ steps.hub.outputs.digest }}" "ghcr.io/orchard-suite/orrery:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-pusher-k8s@${{ steps.pusher-k8s.outputs.digest }}" "ghcr.io/orchard-suite/orrery-pusher-k8s:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-pusher-entra@${{ steps.pusher-entra.outputs.digest }}" "ghcr.io/orchard-suite/orrery-pusher-entra:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-cli@${{ steps.cli.outputs.digest }}" "ghcr.io/orchard-suite/orrery-cli:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-runner@${{ steps.runner.outputs.digest }}" "ghcr.io/orchard-suite/orrery-runner:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-access-runner@${{ steps.access-runner.outputs.digest }}" "ghcr.io/orchard-suite/orrery-access-runner:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-azure-runner@${{ steps.azure-runner.outputs.digest }}" "ghcr.io/orchard-suite/orrery-azure-runner:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-telemetry-runner@${{ steps.telemetry-runner.outputs.digest }}" "ghcr.io/orchard-suite/orrery-telemetry-runner:${{ steps.version.outputs.version }}"
        tag "ghcr.io/orchard-suite/orrery-job-starter@${{ steps.job-starter.outputs.digest }}" "ghcr.io/orchard-suite/orrery-job-starter:${{ steps.version.outputs.version }}"
