<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The theme and zen mode are set before the first paint, so a light page never flashes dark. `setTheme` in theme.ts and `setZen` in zen.ts write the same keys. -->
    <script>
      try {
        if (localStorage.getItem('orrery.theme') === 'light') document.documentElement.dataset.theme = 'light'
        if (localStorage.getItem('orrery.zen') === 'on') document.documentElement.dataset.zen = ''
      } catch {}
    </script>
    <!-- A built file that will not load means this page is from another release than the hub now serving it: load the page again, once. main.tsx clears the mark. -->
    <script>
      addEventListener(
        'error',
        function (event) {
          var target = event.target
          var url = target && (target.src || target.href)
          if (!url || url.indexOf('/assets/') < 0) return
          try {
            if (sessionStorage.getItem('orrery.reloaded')) return
            sessionStorage.setItem('orrery.reloaded', '1')
          } catch (e) {
            return
          }
          location.reload()
        },
        true,
      )
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Added to a Home Screen or installed on a desktop, the hub opens as its own app. A device fetches the icon and manifest without a session, so the hub serves them to anyone. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orrery" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>orrery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
